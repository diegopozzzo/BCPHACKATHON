# Evolution API v2 + Postgres + Redis
#
# Compose lee `.env` en ESTA MISMA CARPETA (raíz del repo). Variables típicas:
#   AUTHENTICATION_API_KEY  → DEBE iguales a EVOLUTION_API_KEY del backend FastAPI.
#   SERVER_URL              → URL pública donde Evolution cree que vive la API (ngrok/https en prod).
#                             En local suele bastar http://localhost:8080
#
# Flujo:
#   1) Copia/edita `.env` (ver env.example). Alineá AUTHENTICATION_API_KEY con EVOLUTION_API_KEY.
#   2) docker compose up -d
#   3) docker compose ps    → espera healthy en postgres/redis; evolution-api "running".
#   4) Crea la instancia (Swagger http://localhost:8080 o POST /manager/create) con nombre = EVOLUTION_INSTANCE.
#   5) Backend: uvicorn y abrir http://localhost:8000/setup/evolution-qr
#
# Webhook hacia FastAPI en el HOST: por defecto ACTIVO para desarrollo local (Docker → tu PC).
# Si EVOLUTION_WEBHOOK_TOKEN en el .env del backend tiene valor, Evolution debe enviar ese token
# en el webhook (según tu build puede ser header apikey o query); en local suele ir vacío.
# En producción cambiá WEBHOOK_BACKEND_URL a una URL HTTPS pública (ngrok, túnel, etc.).
#
# Si ves "All connection attempts failed" desde FastAPI → Evolution no escucha en 8080.

services:
  postgres:
    image: postgres:15-alpine
    container_name: bcp_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bcp_evolution_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: bcp_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-change-me}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: bcp_hackathon
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      DEL_INSTANCE: "false"
      # --- Webhook → backend RutaPe (uvicorn en el host, puerto 8000 por defecto) ---
      WEBHOOK_GLOBAL_ENABLED: ${WEBHOOK_GLOBAL_ENABLED:-true}
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_BACKEND_URL:-http://host.docker.internal:8000/webhooks/evolution}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      # WhatsApp Web cambia versión: afecta QR, login y estabilidad (desconexiones / Stream error).
      # Si conecta y al rato cae, probá otra versión desde https://wppconnect.io/whatsapp-versions/ en tu .env:
      #   CONFIG_SESSION_PHONE_VERSION=2.3000.xxxxxxxx
      # luego: docker compose up -d --force-recreate evolution-api
      CONFIG_SESSION_PHONE_VERSION: ${CONFIG_SESSION_PHONE_VERSION:-2.3000.1037700952}

volumes:
  evolution_pg:
